# Papers. Order doesn't matter: the site sorts them by date, newest first.
#
# id        unique slug, used as the link anchor (#gpse-2024) and in news items
# short     a one-word label for the collaboration graph at the top of the page
# date      YYYY-MM
# authors   write your own name exactly as in profile.yaml; add * for equal contribution
# venue     shown in italics, followed by the year; acronyms in (PARENS) get small caps
# award     optional, e.g. Spotlight or Oral (set in bold saffron)
# note      optional, shown after the venue, e.g. a certification
# featured  true = larger title; a `summary:` is shown beside it on wide screens
#           (the summaries below are switched off: delete the # signs to show one)
# links     any labels you like; they are shown in this order (optional:
#           a paper under review can have none)
# bibtex    optional; adds a BibTeX button with copy-to-clipboard

- id: path-laplacian-2026
  title: "Path Laplacian Encodings for Directed Graphs"
  short: PathLapPE
  date: 2026-10
  authors:
    - Lydia Mezrag*
    - Semih Cantürk*
    - Michael Perlmutter
    - Bastian Rieck
    - Guy Wolf
  venue: arXiv preprint
  featured: true
  # summary: >-
  #   PathLapPE is a spectral positional encoding built from the path Laplacian
  #   of a directed graph. It gives node- and edge-level features that capture
  #   directional, higher-order structure, improves several architectures on
  #   node- and graph-level benchmarks, and, unlike magnetic Laplacian
  #   encodings, needs no directionality hyperparameter to tune.
  links:
    PDF: https://arxiv.org/pdf/2610.04657
    arXiv: https://arxiv.org/abs/2610.04657
  bibtex: |-
    @misc{mezrag2026pathlaplacian,
      title         = {Path Laplacian Encodings for Directed Graphs},
      author        = {Lydia Mezrag and Semih Cant{\"u}rk and Michael Perlmutter and Bastian Rieck and Guy Wolf},
      year          = {2026},
      eprint        = {2610.04657},
      archivePrefix = {arXiv},
      primaryClass  = {cs.LG},
      url           = {https://arxiv.org/abs/2610.04657},
    }

- id: computational-reducibility-2026
  title: "Can Computational Reducibility Lead to Transferable Models for Graph Combinatorial Optimization?"
  short: Reducibility
  date: 2026-07
  authors:
    - Semih Cantürk*
    - Thomas Sabourin*
    - Frederik Wenkel
    - Michael Perlmutter
    - Guy Wolf
  venue: International Conference on Machine Learning (ICML)
  featured: true
  # summary: >-
  #   A GNN encoder that pairs GCON message passing with energy-based
  #   unsupervised losses, plus pretraining and fine-tuning strategies drawn
  #   from the polynomial-reducibility literature. Models transfer between MVC,
  #   MIS and MaxClique, and pretraining on all but one task speeds up
  #   fine-tuning on the remaining one without negative transfer.
  links:
    PDF: https://arxiv.org/pdf/2603.02462
    Code: https://github.com/semihcanturk/COPT-MT
    arXiv: https://arxiv.org/abs/2603.02462
