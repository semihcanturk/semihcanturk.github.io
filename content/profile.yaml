# Paragraphs are separated by a blank line. The first one is set larger.
bio: |-
  My research spans the theory and applications of geometric and topological deep
  learning, with a focus on graph representation learning and spectral graph theory.

  I’m particularly interested in solving combinatorial optimization problems with
  graph learning, in geometric learning on biomolecular data, and in positional and
  structural encodings that make graph learning more effective and scalable. I work
  in [Guy Wolf’s group](http://guywolf.org) at
  [Mila – Quebec AI Institute](https://mila.quebec/en) and
  [Université de Montréal (DIRO)](https://diro.umontreal.ca).

  I did my MSc at Mila and UdeM as well, and my BSE at the University of
  Pennsylvania. In fall 2025 I was a visiting researcher in Christopher Morris’s
  [LOG group at RWTH Aachen](https://log-rwth.github.io), and in 2024 a PhD intern
  at [Valence Labs](https://www.valencelabs.com), working on accelerating molecular
  dynamics simulations with machine-learned interatomic potentials. Before my PhD
  I was an ML engineer at [Zetane Systems](https://zetane.com).

